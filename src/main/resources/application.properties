#spring.application.name=climbthepeak
# Application Name
spring.application.name=climbthepeak

# ========================================
# PostgreSQL Database Configuration
# ========================================

# Database Connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/UserProject
spring.datasource.username=postgres
spring.datasource.password=password

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate Configuration
# ========================================

# Hibernate DDL auto (create, create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (for debugging)
spring.jpa.show-sql=true

# Format SQL queries (readable format)
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# Connection Pool (HikariCP - default)
# ========================================

# Maximum pool size
spring.datasource.hikari.maximum-pool-size=10

# Minimum idle connections
spring.datasource.hikari.minimum-idle=5

# Connection timeout (30 seconds)
spring.datasource.hikari.connection-timeout=30000

# ========================================
# Logging (Optional - for debugging)
# ========================================

# Log SQL parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
